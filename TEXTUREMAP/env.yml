# Conda environment for the cloud GPU box (RunPod / Vast.ai / Kaggle).
# Pins CUDA-enabled PyTorch so StyleGAN3's custom ops compile.
#
#   conda env create -f env.yml && conda activate csx-sphere
#
# On this Mac (no CUDA) you do NOT need this — the src/ core + data scripts run
# on the system Python with `pip install -r requirements.txt`.

name: csx-sphere
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - pip
  - pip:
      - -r requirements.txt
